  <meta name="theme-color" content="#24352d">
  <title>جاليري البحراوي | تواصل معنا</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 18px; color: #f7f3e9;
      background: radial-gradient(circle at top, #526b59 0, #24352d 58%, #18251f 100%);

    main { width: min(100%, 430px); text-align: center; }

    .links { display: grid; gap: 13px; }
    a {
      display: block; padding: 16px 20px; border: 1px solid rgba(227,212,170,.65);
      border-radius: 12px; color: #f7f3e9; text-decoration: none;
      background: rgba(255,255,255,.07); font-size: 16px; font-weight: 600;
      transition: background .2s, transform .2s;
    }
    a:hover { background: rgba(255,255,255,.15); transform: translateY(-2px); }
    footer { margin-top: 28px; color: #c9c2b2; font-size: 12px; }
  </style>
</head>
